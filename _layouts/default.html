<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  {% include head.html %}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {% include header.html %}
  <main id="main">
    {{ content }}
  </main>
  <footer class="site-footer container">
    <span>&copy; {{ 'now' | date: '%Y' }} {{ site.author }}</span>
    <span class="footer-links">
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      <a href="https://app.pagescms.org" rel="nofollow">Write</a>
    </span>
  </footer>
</body>
</html>
